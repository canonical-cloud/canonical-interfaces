name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      # Generator self-tests + `--check` that generated/ is up to date.
      - run: npm test

  # The generated Rust->WebAssembly crate must compile to wasm32 and produce a
  # valid wasm-bindgen package (this is what surfaces tsify type-mapping bugs).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: cargo build --manifest-path generated/rust-wasm/Cargo.toml --target wasm32-unknown-unknown
      - run: wasm-pack build generated/rust-wasm --target web
