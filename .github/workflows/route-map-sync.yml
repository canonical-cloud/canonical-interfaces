name: route-map-sync

on:
  push:
    branches:
      - main
      - DEN-4058/pre-interest-contract-v1
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install pinned Draft 2020-12 validator
        run: >-
          python -m pip install --disable-pip-version-check
          jsonschema==4.25.1
          referencing==0.36.2
          rpds-py==0.27.0

      - name: Check route-map synchronization
        run: python3 scripts/check-route-sync.py

      - name: Check generated routes
        run: >-
          python3 scripts/generate-routes.py
          --map route-maps/api.route-map.json
          --out generated/routes
          --check

  generate-den4058:
    name: generate DEN-4058 projections once
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/DEN-4058/pre-interest-contract-v1' &&
      github.actor == 'ORESoftware'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-4058/pre-interest-contract-v1
          persist-credentials: true
          fetch-depth: 2

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Buf 1.72.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.72.0"
          github_token: ${{ github.token }}

      - name: Extend the exact generated-type inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/generate.test.mjs")
          text = path.read_text(encoding="utf-8")
          old = "    'MutationResult',\n    'QuoteDetail',"
          new = (
              "    'MutationResult',\n"
              "    'PreInterestProblem',\n"
              "    'PreInterestRegistrationRequest',\n"
              "    'PreInterestRegistrationResponse',\n"
              "    'QuoteDetail',"
          )
          if text.count(new) == 1 and text.count(old) == 0:
              pass
          elif text.count(old) == 1 and text.count(new) == 0:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          else:
              raise SystemExit("unexpected generated-type inventory shape")
          PY

      - name: Compile TypeSpec and Protobuf sources
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/typespec" \
            --ignore-scripts --no-audit --no-fund \
            @typespec/compiler@1.14.0
          "$RUNNER_TEMP/typespec/node_modules/.bin/tsp" compile \
            contracts/pre-interest/v1/main.tsp --no-emit
          buf format -w contracts/pre-interest/v1/pre_interest.proto
          buf format -w contracts/pre-interest/v1/baseline/pre_interest.proto
          buf lint contracts/pre-interest/v1
          buf lint contracts/pre-interest/v1/baseline
          buf build contracts/pre-interest/v1 \
            -o "$RUNNER_TEMP/pre_interest.descriptor.binpb"
          buf breaking contracts/pre-interest/v1 \
            --against contracts/pre-interest/v1/baseline
          hash="$(sha256sum "$RUNNER_TEMP/pre_interest.descriptor.binpb" | awk '{print $1}')"
          printf '%s  pre_interest.descriptor.binpb\n' "$hash" \
            > contracts/pre-interest/v1/pre_interest.descriptor.sha256

      - name: Generate all language and HTTP-route projections
        shell: bash
        run: |
          set -euo pipefail
          node scripts/project-pre-interest-contract.mjs --write
          npm run generate
          python3 scripts/generate-routes.py \
            --map route-maps/api.route-map.json \
            --out generated/routes

      - name: Validate exact generated state
        shell: bash
        run: |
          set -euo pipefail
          npm test
          python3 scripts/generate-routes.py \
            --map route-maps/api.route-map.json \
            --out generated/routes \
            --check
          git diff --check

      - name: Push generated review content
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet && {
            echo "expected generated contract changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(DEN-4058): generate pre-interest contract adapters"
          git push origin "HEAD:${GITHUB_REF_NAME}"
