name: route-map-sync

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install pinned Draft 2020-12 validator
        run: >-
          python -m pip install --disable-pip-version-check
          jsonschema==4.25.1
          referencing==0.36.2
          rpds-py==0.27.0

      - name: Check route-map synchronization
        run: python3 scripts/check-route-sync-v1.py --map route-maps/legacy/api.route-map.json

      - name: Check generated routes
        run: >-
          python3 scripts/generate-routes.py
          --map route-maps/legacy/api.route-map.json
          --out generated/routes
          --check

      - name: Check out the immutable matching domain route snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: canonical-cloud/canonical-lib-core
          ref: b34d7e7d2ef824ba41933ac749df14f6d56e65fe
          path: .compat/canonical-lib-core
          persist-credentials: false
          fetch-depth: 1

      - name: Validate typed v2 contracts and cross-repository equality
        run: >-
          python3 scripts/check-route-sync.py --root .
          --identical .compat/canonical-lib-core/route-maps/api.route-map.json
          --identical .compat/canonical-lib-core/route-maps/web.route-map.json

      - name: Verify v1 endpoint coverage survives the v2 migration
        run: node --test scripts/route-compatibility.test.mjs
