name: route-map-sync
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python3 scripts/check-route-sync.py
      - run: python3 scripts/generate-routes.py --map route-maps/api.route-map.json --out generated/routes --check
