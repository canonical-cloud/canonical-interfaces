name: route-map-sync
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 scripts/check-route-sync.py
      - run: python3 scripts/generate-routes.py --map route-maps/api.route-map.json --out generated/routes --check
