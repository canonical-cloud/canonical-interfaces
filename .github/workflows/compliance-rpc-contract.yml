name: Compliance RPC TypeSpec and JSON Schema parity

on:
  pull_request:
    paths:
      - "contracts/compliance-rpc/v1/**"
      - ".github/workflows/compliance-rpc-contract.yml"
  push:
    branches: [main, dev]
    paths:
      - "contracts/compliance-rpc/v1/**"
      - ".github/workflows/compliance-rpc-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-rpc-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Admit independently authored compliance RPC authorities
        uses: ORESoftware/typespec-json-schema-validator@3171025cbe03a7026a71ce94eea18c910e1431b2
        with:
          typespec: contracts/compliance-rpc/v1/main.tsp
          schema: contracts/compliance-rpc/v1/authored.schema.json
          instances: contracts/compliance-rpc/v1/instances
          report: .typespec-json-schema-validator/compliance-rpc-report.json
          sarif: .typespec-json-schema-validator/compliance-rpc.sarif
          contract_ir: .typespec-json-schema-validator/compliance-rpc.contract-ir.json
          output_dir: .typespec-json-schema-validator/compliance-rpc-generated
          int64_strategy: number
          max_probes: "128"

      - name: Retain exact-head parity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-rpc-contract-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
