name: GRC workspace TypeSpec and JSON Schema parity

on:
  pull_request:
    paths:
      - "contracts/grc-workspace/v1/**"
      - ".github/workflows/grc-workspace-contract.yml"
  push:
    branches: [main, dev]
    paths:
      - "contracts/grc-workspace/v1/**"
      - ".github/workflows/grc-workspace-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grc-workspace-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compare independently authored GRC workspace authorities
        uses: ORESoftware/typespec-json-schema-validator@3171025cbe03a7026a71ce94eea18c910e1431b2
        with:
          typespec: contracts/grc-workspace/v1/main.tsp
          schema: contracts/grc-workspace/v1/authored.schema.json
          instances: contracts/grc-workspace/v1/instances
          report: .typespec-json-schema-validator/grc-workspace-report.json
          sarif: .typespec-json-schema-validator/grc-workspace.sarif
          contract_ir: .typespec-json-schema-validator/grc-workspace.contract-ir.json
          output_dir: .typespec-json-schema-validator/grc-workspace-generated
          int64_strategy: number
          max_probes: "256"
      - name: Verify admissible exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(".typespec-json-schema-validator/grc-workspace-report.json", "utf8"));
          const ir = JSON.parse(readFileSync(".typespec-json-schema-validator/grc-workspace.contract-ir.json", "utf8"));
          assert.equal(report.status, "passed");
          assert.equal(report.zeroUnexplainedFindings, true);
          assert.deepEqual(report.findings, []);
          assert.equal(ir.status, "passed");
          assert.equal(ir.admissible, true);
          assert.equal(ir.editableAuthority, false);
          assert.equal(ir.authorities.precedence, "none");
          assert.ok(ir.admission.scope.admittedDeclarations >= 30);
          NODE
      - name: Retain parity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grc-workspace-contract-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
