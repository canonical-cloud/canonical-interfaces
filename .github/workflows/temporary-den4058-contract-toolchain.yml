name: Generate DEN-4058 pre-interest projections once
# dd:execution-carrier owner=DEN-4058 expires=2026-09-04

on:
  push:
    branches: [DEN-4058/pre-interest-contract-v1]
    paths:
      - contracts/pre-interest/v1/**
      - schema/index.json
      - scripts/project-pre-interest-contract.mjs
      - scripts/project-pre-interest-contract.test.mjs
      - route-maps/api.route-map.json
      - tests/interface-conformance/fixtures.mjs
      - src/generate.mjs
      - src/generate.test.mjs
      - src/enum-symbols.test.mjs
      - package.json
      - .zpkg.toml
      - .github/workflows/pre-interest-contract.yml
      - .github/workflows/temporary-den4058-contract-toolchain.yml

permissions:
  contents: write

concurrency:
  group: den-4058-pre-interest-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-retire:
    if: github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 2

      - name: Verify exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Buf 1.72.0
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.72.0"
          github_token: ${{ github.token }}

      - name: Harden portable enum symbols and generated-type inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          generator = Path("src/generate.mjs")
          text = generator.read_text(encoding="utf-8")
          old_pascal = 'const pascal = (s) => s.split(/[_\\-\\s]+/).map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join("");'
          new_pascal = '''const pascal = (value) => {
            const words = String(value).match(/[A-Za-z0-9]+/g) || [];
            let symbol = words
              .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
              .join("");
            if (!symbol) {
              fail(`cannot derive a portable identifier from ${JSON.stringify(value)}`);
            }
            if (/^[0-9]/.test(symbol)) symbol = `Value${symbol}`;
            if (!/^[A-Za-z][A-Za-z0-9]*$/.test(symbol)) {
              fail(`cannot derive a portable identifier from ${JSON.stringify(value)}`);
            }
            return symbol;
          };'''
          if text.count(old_pascal) != 1:
              raise SystemExit("unexpected pascal helper shape")
          text = text.replace(old_pascal, new_pascal, 1)

          old_collect = '''function collectEnums(types) {
            const enums = new Map();
            for (const t of types) {
              for (const p of t.props) {
                if (isStringEnum(p.schema)) {
                  const enumName = enumTypeName(t.name, p.name);
                  enums.set(enumName, p.schema.enum);
                }
              }
            }
            return enums;
          }'''
          new_collect = '''function collectEnums(types) {
            const enums = new Map();
            for (const t of types) {
              for (const p of t.props) {
                if (!isStringEnum(p.schema)) continue;
                const enumName = enumTypeName(t.name, p.name);
                const values = p.schema.enum.slice();
                const symbols = new Map();
                for (const value of values) {
                  if (typeof value !== "string") {
                    fail(`${enumName}: string enum contains a non-string value`);
                  }
                  const symbol = pascal(value);
                  const previous = symbols.get(symbol);
                  if (previous !== undefined) {
                    fail(
                      `${enumName}: enum values ${JSON.stringify(previous)} and ${JSON.stringify(value)} both map to portable enum symbol "${symbol}"`,
                    );
                  }
                  symbols.set(symbol, value);
                }
                enums.set(enumName, values);
              }
            }
            return enums;
          }'''
          if text.count(old_collect) != 1:
              raise SystemExit("unexpected collectEnums helper shape")
          generator.write_text(text.replace(old_collect, new_collect, 1), encoding="utf-8")

          inventory = Path("src/generate.test.mjs")
          inventory_text = inventory.read_text(encoding="utf-8")
          old = "    'MutationResult',\n    'QuoteDetail',"
          new = (
              "    'MutationResult',\n"
              "    'PreInterestProblem',\n"
              "    'PreInterestRegistrationRequest',\n"
              "    'PreInterestRegistrationResponse',\n"
              "    'QuoteDetail',"
          )
          if inventory_text.count(new) == 1 and inventory_text.count(old) == 0:
              pass
          elif inventory_text.count(old) == 1 and inventory_text.count(new) == 0:
              inventory.write_text(inventory_text.replace(old, new, 1), encoding="utf-8")
          else:
              raise SystemExit("unexpected generated-type inventory shape")
          PY

      - name: Compile TypeSpec and Protobuf sources
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/typespec" \
            --ignore-scripts --no-audit --no-fund \
            @typespec/compiler@1.14.0
          "$RUNNER_TEMP/typespec/node_modules/.bin/tsp" compile \
            contracts/pre-interest/v1/main.tsp --no-emit
          buf format -w contracts/pre-interest/v1/pre_interest.proto
          buf format -w contracts/pre-interest/v1/baseline/pre_interest.proto
          buf lint contracts/pre-interest/v1
          buf lint contracts/pre-interest/v1/baseline
          buf build contracts/pre-interest/v1 \
            -o "$RUNNER_TEMP/pre_interest.descriptor.binpb"
          buf breaking contracts/pre-interest/v1 \
            --against contracts/pre-interest/v1/baseline
          hash="$(sha256sum "$RUNNER_TEMP/pre_interest.descriptor.binpb" | awk '{print $1}')"
          printf '%s  pre_interest.descriptor.binpb\n' "$hash" \
            > contracts/pre-interest/v1/pre_interest.descriptor.sha256

      - name: Generate all language and HTTP-route projections
        shell: bash
        run: |
          set -euo pipefail
          node scripts/project-pre-interest-contract.mjs --write
          npm run generate
          python3 scripts/generate-routes.py \
            --map route-maps/api.route-map.json \
            --out generated/routes

      - name: Validate exact generated state
        shell: bash
        run: |
          set -euo pipefail
          npm test
          python3 scripts/generate-routes.py \
            --map route-maps/api.route-map.json \
            --out generated/routes \
            --check
          git diff --check

      - name: Retire carrier, push review content, and verify remote head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          Path(".github/workflows/temporary-den4058-contract-toolchain.yml").unlink()
          PY
          git add -A
          git diff --cached --quiet && {
            echo "expected generated or carrier-retirement changes"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(DEN-4058): generate pre-interest contract adapters"
          git push origin "HEAD:DEN-4058/pre-interest-contract-v1"
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --heads origin refs/heads/DEN-4058/pre-interest-contract-v1 | awk '{print $1}')"
          test "$remote_head" = "$local_head"
