name: debug quote v1 tests once

on:
  push:
    branches:
      - den-2642/quote-v1-convergence
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Capture exact Node and generated-output checks
        shell: bash
        run: |
          set +e
          {
            node --test src/*.test.mjs
            node src/generate-output.mjs --check
          } >quote-v1-test.log 2>&1
          status=$?
          cat quote-v1-test.log
          echo "$status" >quote-v1-test.status
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quote-v1-test-output-${{ github.event_name }}
          path: |
            quote-v1-test.log
            quote-v1-test.status
          if-no-files-found: error
          retention-days: 1
