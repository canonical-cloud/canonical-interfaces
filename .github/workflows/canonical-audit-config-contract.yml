name: Canonical audit config TypeSpec and JSON Schema parity

on:
  pull_request:
    paths:
      - "contracts/canonical-audit-config/v1/**"
      - ".github/workflows/canonical-audit-config-contract.yml"
  push:
    branches: [main, dev]
    paths:
      - "contracts/canonical-audit-config/v1/**"
      - ".github/workflows/canonical-audit-config-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-audit-config-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
      - name: Prove exact customer TOML serializes to the admitted full JSON instance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          toml_path = Path("contracts/canonical-audit-config/v1/fixtures/customer-1-demo.toml")
          json_path = Path("contracts/canonical-audit-config/v1/instances/CanonicalAuditConfig/valid/customer-1-demo-full.json")
          with toml_path.open("rb") as handle:
              parsed = tomllib.load(handle)
          expected = json.loads(json_path.read_text(encoding="utf-8"))
          if parsed != expected:
              raise SystemExit("customer-1-demo TOML does not serialize to the admitted full JSON fixture")
          print("customer-1-demo TOML serialization: exact match")
          PY
      - name: Compare independently authored canonical audit config authorities
        uses: ORESoftware/typespec-json-schema-validator@3171025cbe03a7026a71ce94eea18c910e1431b2
        with:
          typespec: contracts/canonical-audit-config/v1/main.tsp
          schema: contracts/canonical-audit-config/v1/authored.schema.json
          instances: contracts/canonical-audit-config/v1/instances
          report: .typespec-json-schema-validator/canonical-audit-config-report.json
          sarif: .typespec-json-schema-validator/canonical-audit-config.sarif
          contract_ir: .typespec-json-schema-validator/canonical-audit-config.contract-ir.json
          output_dir: .typespec-json-schema-validator/canonical-audit-config-generated
          int64_strategy: number
          max_probes: "192"
      - name: Verify admissible exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(".typespec-json-schema-validator/canonical-audit-config-report.json", "utf8"));
          const ir = JSON.parse(readFileSync(".typespec-json-schema-validator/canonical-audit-config.contract-ir.json", "utf8"));
          assert.equal(report.schema, "ores.typespec-json-schema-validator.report/v1");
          assert.equal(report.status, "passed");
          assert.equal(report.zeroUnexplainedFindings, true);
          assert.deepEqual(report.findings, []);
          assert.equal(ir.status, "passed");
          assert.equal(ir.admissible, true);
          assert.equal(ir.editableAuthority, false);
          assert.equal(ir.authorities.precedence, "none");
          assert.equal(ir.admission.receipt.runId, report.runId);
          assert.ok(ir.admission.scope.admittedDeclarations >= 20);
          NODE
      - name: Retain parity receipt, Contract IR, SARIF and generated witness
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-audit-config-contract-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
