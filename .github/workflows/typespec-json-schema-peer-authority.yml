name: TypeSpec and JSON Schema Contract IR admission

on:
  pull_request:
    paths:
      - "schema-authority-canary/**"
      - "contract-admission/contract-ir-consumer.json"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  push:
    branches: [main, dev]
    paths:
      - "schema-authority-canary/**"
      - "contract-admission/contract-ir-consumer.json"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  schedule:
    - cron: "13 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-ir-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compare peer authorities and emit Contract IR
        uses: ORESoftware/typespec-json-schema-validator@3171025cbe03a7026a71ce94eea18c910e1431b2
        with:
          typespec: schema-authority-canary/main.tsp
          schema: schema-authority-canary/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          sarif: .typespec-json-schema-validator/report.sarif
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "64"
      - name: Verify authority-owner admission
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("contract-admission/contract-ir-consumer.json", "utf8"));
          const report = JSON.parse(readFileSync(".typespec-json-schema-validator/report.json", "utf8"));
          const ir = JSON.parse(readFileSync(".typespec-json-schema-validator/contract-ir.json", "utf8"));
          const sha = /^[a-f0-9]{64}$/;
          assert.equal(manifest.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(manifest.repositoryRole, "interfaces");
          assert.equal(manifest.canonicalAuthorityRepository, process.env.GITHUB_REPOSITORY);
          assert.equal(manifest.validator.actionCommit, "3171025cbe03a7026a71ce94eea18c910e1431b2");
          assert.equal(manifest.authorityModel.precedence, "none");
          assert.equal(manifest.admission.allowFallbackAuthority, false);
          assert.equal(report.schema, "ores.typespec-json-schema-validator.report/v1");
          assert.equal(report.status, "passed");
          assert.equal(report.zeroUnexplainedFindings, true);
          assert.deepEqual(report.findings, []);
          assert.match(report.runId, sha);
          assert.equal(ir.schema, manifest.validator.contractIrSchema);
          assert.equal(ir.status, "passed");
          assert.equal(ir.admissible, true);
          assert.equal(ir.editableAuthority, false);
          assert.deepEqual(ir.authorities, { typespec: "independently-authored", jsonSchema: "independently-authored", generatedJsonSchema: "comparison-evidence-only", precedence: "none" });
          assert.match(ir.irId, sha);
          assert.equal(ir.admission.receipt.runId, report.runId);
          assert.equal(ir.admission.receipt.status, "passed");
          assert.equal(ir.admission.receipt.zeroUnexplainedFindings, true);
          assert.match(ir.admission.receipt.digest, sha);
          for (const field of ["exactInputDigests", "directDeclarationInventory", "generatedSchemaComparison", "differentialInstanceValidation", "zeroUnexplainedFindings"]) assert.equal(ir.admission.requirements[field], true);
          assert.ok(ir.admission.scope.admittedDeclarations > 0);
          NODE
      - name: Retain receipt, Contract IR, SARIF, and generated witness
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-ir-admission-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
