name: quote-contract-generate

on:
  push:
    branches: [feat/quote-contract-v1]

permissions:
  contents: write

concurrency:
  group: quote-contract-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/quote-contract-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Generate and verify all language adapters
        run: |
          set -euo pipefail
          npm run generate
          npm test
      - name: Upload exact generated adapters
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quote-contract-generated-${{ github.run_id }}
          path: generated
          if-no-files-found: error
          retention-days: 3
      - name: Commit generated adapters
        shell: bash
        run: |
          set -euo pipefail
          git add generated
          if git diff --cached --quiet; then
            echo "generated adapters already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate quote contract adapters"
          git push origin HEAD:feat/quote-contract-v1
