name: Generate DEN-1362 lock artifacts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: den-1362-lock-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95"
      - name: Generate exact dependency locks
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path generated/rust-wasm/Cargo.toml
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --prefix .ci
      - name: Validate artifact contents
        shell: bash
        run: |
          set -euo pipefail
          test -s generated/rust-wasm/Cargo.lock
          test -s .ci/package-lock.json
          node -e 'const lock=require("./.ci/package-lock.json"); if (lock.packages["node_modules/typescript"].version !== "5.9.3") process.exit(1)'
          cargo metadata \
            --locked \
            --no-deps \
            --format-version 1 \
            --manifest-path generated/rust-wasm/Cargo.toml \
            >/dev/null
      - name: Upload reviewed lock artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: den-1362-locks-${{ github.run_id }}
          path: |
            generated/rust-wasm/Cargo.lock
            .ci/package-lock.json
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
