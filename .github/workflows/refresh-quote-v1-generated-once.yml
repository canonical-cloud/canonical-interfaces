name: refresh quote v1 generated adapters once

on:
  push:
    branches:
      - den-2642/quote-v1-convergence

permissions:
  contents: write

concurrency:
  group: refresh-quote-v1-generated-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: den-2642/quote-v1-convergence
          persist-credentials: true
          show-progress: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Generate and commit exact adapters
        shell: bash
        run: |
          set -euo pipefail
          node src/generate-output.mjs
          if git diff --quiet -- generated; then
            echo 'generated adapters already exact'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated
          git commit -m 'chore(interfaces): regenerate quote v1 adapters'
          git push origin HEAD:den-2642/quote-v1-convergence
