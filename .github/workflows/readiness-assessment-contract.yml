name: Readiness assessment TypeSpec and JSON Schema parity

on:
  pull_request:
    paths:
      - "contracts/readiness-assessment/v1/**"
      - "scripts/check-readiness-assessment-runtime.mjs"
      - "src/project-admitted-contract-ir.mjs"
      - ".github/workflows/readiness-assessment-contract.yml"
  push:
    branches: [main, dev]
    paths:
      - "contracts/readiness-assessment/v1/**"
      - "scripts/check-readiness-assessment-runtime.mjs"
      - "src/project-admitted-contract-ir.mjs"
      - ".github/workflows/readiness-assessment-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-assessment-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compare independently authored assessment authorities
        uses: ORESoftware/typespec-json-schema-validator@3171025cbe03a7026a71ce94eea18c910e1431b2
        with:
          typespec: contracts/readiness-assessment/v1/main.tsp
          schema: contracts/readiness-assessment/v1/authored.schema.json
          instances: contracts/readiness-assessment/v1/instances
          report: .typespec-json-schema-validator/readiness-assessment-report.json
          sarif: .typespec-json-schema-validator/readiness-assessment.sarif
          contract_ir: .typespec-json-schema-validator/readiness-assessment.contract-ir.json
          output_dir: .typespec-json-schema-validator/readiness-assessment-generated
          int64_strategy: number
          max_probes: "128"
      - name: Verify admissible exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(".typespec-json-schema-validator/readiness-assessment-report.json", "utf8"));
          const ir = JSON.parse(readFileSync(".typespec-json-schema-validator/readiness-assessment.contract-ir.json", "utf8"));
          assert.equal(report.schema, "ores.typespec-json-schema-validator.report/v1");
          assert.equal(report.status, "passed");
          assert.equal(report.zeroUnexplainedFindings, true);
          assert.deepEqual(report.findings, []);
          assert.equal(ir.status, "passed");
          assert.equal(ir.admissible, true);
          assert.equal(ir.editableAuthority, false);
          assert.equal(ir.authorities.precedence, "none");
          assert.equal(ir.admission.receipt.runId, report.runId);
          assert.ok(ir.admission.scope.admittedDeclarations >= 10);
          NODE
      - name: Verify runtime relational invariants
        run: node scripts/check-readiness-assessment-runtime.mjs
      - name: Project the admitted common contract surface
        shell: bash
        run: |
          set -euo pipefail
          node src/project-admitted-contract-ir.mjs \
            --input .typespec-json-schema-validator/readiness-assessment.contract-ir.json \
            --output .typespec-json-schema-validator/readiness-assessment.admitted-projection.schema.json
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const projection = JSON.parse(readFileSync(".typespec-json-schema-validator/readiness-assessment.admitted-projection.schema.json", "utf8"));
          const ir = JSON.parse(readFileSync(".typespec-json-schema-validator/readiness-assessment.contract-ir.json", "utf8"));
          assert.equal(projection["x-canonical-generated"], true);
          assert.equal(projection["x-canonical-source"].kind, "admitted-contract-ir");
          assert.equal(projection["x-canonical-source"].runId, ir.admission.receipt.runId);
          assert.deepEqual(
            Object.keys(projection.$defs).sort(),
            [
              "AssessmentControlMapping",
              "AssessmentCounts",
              "AssessmentEvidenceRef",
              "AssessmentFinding",
              "AssessmentFindingStatus",
              "AssessmentRecommendationInput",
              "AssessmentReport",
              "AssessmentSeverity",
              "AssessmentTarget",
              "RecommendationPriority",
            ].sort(),
          );
          NODE
      - name: Retain parity receipt, Contract IR, projection, SARIF and generated witness
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readiness-assessment-contract-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
